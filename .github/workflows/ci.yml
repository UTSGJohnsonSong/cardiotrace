name: CI

# Two questions, kept separate because they fail for different reasons and a
# reader of a red build should not have to work out which one broke.
#
#   tests    Does the code still do what it claims? Runs on synthetic XPT
#            fixtures, so it needs no NHANES download and no database.
#   rebuild  Do the committed artefacts still match the code that writes them?
#            Every published number on the site is read out of a file in
#            reports/, and those files are committed. When one drifts, the site
#            shows a number no current script produces -- silently. That is not
#            hypothetical: docs/consistency-audit.md found nine of them.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Several scripts print en dashes and Chinese. On a runner whose default
  # encoding is not UTF-8 the writes raise UnicodeEncodeError, which fails the
  # build for a reason that has nothing to do with the code under test.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      - name: pytest
        run: python -m pytest -q

  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt

      # The badge in the README says how many tests pass, and render_readme.py
      # reads that number out of reports/test_summary.json, which the suite
      # writes. Running pytest here first is what makes the badge claim
      # checkable: add a test without regenerating the README and this job
      # rewrites the badge, which shows up as a diff. Skip this step and both
      # jobs pass while the front page understates the suite.
      # test_summary.json itself is excluded from the diff -- it is an output of
      # the test run, not of the pipeline.
      - name: Run the suite so the test count is current
        run: python -m pytest -q

      # --render, not the default scope. data/processed/ and data/raw/ are
      # gitignored, so a checkout has the artefacts but not the cohort that
      # produced them, and every other stage reads that cohort. The renderers
      # read only tracked files, which is exactly the boundary where the
      # observed failure lived: a page disagreeing with the artefact behind it.
      - name: Clean rebuild leaves no diff
        run: python scripts/verify_clean_rebuild.py --render

      # verify_clean_rebuild already exits non-zero on a diff. This runs anyway,
      # so that a red build shows WHAT changed rather than only that something
      # did -- on a runner nobody can rerun the command by hand.
      - name: Show the diff if there was one
        if: failure()
        run: git --no-pager diff --stat && git --no-pager diff -- '*.json' '*.csv' '*.md'
